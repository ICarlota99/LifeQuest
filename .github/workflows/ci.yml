name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @lifequest/domain test
      - run: pnpm --filter @lifequest/domain build
      - run: pnpm --filter @lifequest/db build
      - run: pnpm --filter @lifequest/api typecheck
      - run: pnpm --filter @lifequest/web typecheck
