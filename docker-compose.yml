services:
  postgres:
    image: postgres:16-alpine
    container_name: lifequest-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lifequest
      POSTGRES_PASSWORD: lifequest
      POSTGRES_DB: lifequest
    volumes:
      - lifequest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifequest -d lifequest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifequest_pg_data:
